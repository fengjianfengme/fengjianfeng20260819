<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>照片墙 · 冯建峰</title>
<style>
:root{
  --bg:#eef2f9; --bg2:#e3e9f5; --card:rgba(255,255,255,.72); --text:#1c2433; --muted:#5b6679;
  --blue:#4f8cff; --purple:#a06bff; --cyan:#2fd6c6; --line:rgba(20,30,60,.10);
}
body.dark{
  --bg:#0c1020; --bg2:#141d33; --card:rgba(255,255,255,.06); --text:#e8edf7; --muted:#9aa6bd;
  --line:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--text); min-height:100vh; line-height:1.6;
  background:
    radial-gradient(1200px 600px at 12% -8%, rgba(79,140,255,.20), transparent 60%),
    radial-gradient(1000px 520px at 92% 4%, rgba(160,107,255,.20), transparent 60%),
    radial-gradient(900px 500px at 50% 110%, rgba(47,214,198,.16), transparent 60%),
    linear-gradient(160deg,var(--bg),var(--bg2));
  background-attachment:fixed;
  transition:background .5s ease,color .4s ease;
}
.wrap{max-width:1000px;margin:0 auto;padding:26px 20px 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;
  font-size:14px;backdrop-filter:blur(12px);transition:.25s}
.back:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(79,140,255,.25)}
.switch{cursor:pointer;padding:8px 14px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);color:var(--text);font-size:14px;display:flex;gap:8px;align-items:center;
  backdrop-filter:blur(12px);transition:.25s}
.switch:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(160,107,255,.22)}
.switch .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple))}
.hero{text-align:center;padding:18px 0 10px}
.hero h1{font-size:34px;letter-spacing:1px;
  background:linear-gradient(120deg,var(--blue),var(--purple),var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{color:var(--muted);margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:26px}
.album{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:22px;backdrop-filter:blur(14px);cursor:pointer;text-decoration:none;
  color:var(--text);box-shadow:0 10px 30px rgba(15,25,55,.08);transition:transform .3s,box-shadow .3s}
.album:hover{transform:translateY(-5px);box-shadow:0 18px 46px rgba(79,140,255,.30)}
.album .ico{font-size:36px;line-height:1}
.album .t{font-size:18px;font-weight:700}
.album .src{display:inline-block;font-size:12px;padding:3px 11px;border-radius:999px;
  background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;width:fit-content}
.album .d{color:var(--muted);font-size:13px}
.album .go{margin-top:4px;color:var(--blue);font-size:14px;font-weight:600}
.note{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:50px}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media (max-width:560px){.hero h1{font-size:26px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← 返回主页</a>
    <div class="switch" id="themeBtn" title="切换亮 / 暗主题"><span id="themeTxt">🌙 暗色</span><span class="dot"></span></div>
  </div>

  <header class="hero reveal">
    <h1>照片墙</h1>
    <div class="sub">冯建峰 · 相册导航 · 点击进入各平台相册</div>
  </header>

  <div class="cards" id="cards"></div>

  <div class="note">还想加 QQ 相册或其他网盘？把分享链接发我，我帮你加进来。</div>

  <footer>冯建峰 · 照片墙 · 明暗主题 · fengjianfeng.me</footer>
</div>

<script>
// 主题切换
(function(){
  var b=document.body, btn=document.getElementById('themeBtn'), txt=document.getElementById('themeTxt');
  if(localStorage.getItem('ff_theme')==='dark'){b.classList.add('dark');txt.textContent='☀️ 亮色';}
  btn.onclick=function(){b.classList.toggle('dark');var d=b.classList.contains('dark');
    txt.textContent=d?'☀️ 亮色':'🌙 暗色';localStorage.setItem('ff_theme',d?'dark':'light');};
})();

// 相册列表（以后加 QQ 相册，往这个数组里加一条即可）
var ALBUMS=[
  {ico:'📦', title:'冯建峰荣耀200相册整理', src:'百度网盘', desc:'共 200 张照片 · 百度网盘分享', url:'https://pan.baidu.com/s/5F18TE0t3D7isC9T8T81bQA'}
];

var cards=document.getElementById('cards');
ALBUMS.forEach(function(a){
  var el=document.createElement('a');
  el.className='album reveal';
  el.href=a.url; el.target='_blank'; el.rel='noopener';
  el.innerHTML='<div class="ico">'+a.ico+'</div>'+
    '<div class="t">'+a.title+'</div>'+
    '<span class="src">'+a.src+'</span>'+
    '<div class="d">'+a.desc+'</div>'+
    '<div class="go">点击进入相册 →</div>';
  cards.appendChild(el);
});

// 滚动揭示
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.1});
document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});
</script>
</body>
</html>
